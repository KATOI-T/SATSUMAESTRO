name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the idea. English and Japanese are both fine.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like SATSUMAESTRO to do. Commands, settings or screen output you have in mind are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you use now, or how other tools handle it.
  - type: input
    id: model
    attributes:
      label: Provider and model you use
      placeholder: Ollama, qwen3-coder:30b
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues.
          required: true
        - label: I would like to work on this myself.
