# リリース: build して PyPI / TestPyPI に公開し、GitHub Release を作る（テストは手元の make check / make smoke で済ませておく）。
#
# - `v*` のタグを push → build → environment `pypi` の承認 → PyPI → GitHub Release（本文は CHANGELOG の節・同じ配布物を添える）
# - 手動で起動（workflow_dispatch）→ build → environment `testpypi` → TestPyPI（タグを打つ前の予行）
#
# 公開は Trusted Publishing（PyPI / TestPyPI に登録した publisher: このリポジトリ・release.yml・environment）。
# API トークンは置かない。id-token の権限は公開の job にだけ、contents の書き込みは Release の job にだけ渡す。
# 出所の証明（attestation）は既定で付く。actions はコミットの SHA で固定する。

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# 公開は 1 本ずつ。走っている公開は途中で止めない
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.9"
          # リリースの build はキャッシュを使わない（キャッシュの汚染を持ち込まない）
          enable-cache: false

      - name: Check that the tag matches the package version
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' satsumaestro/__about__.py)
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::tag ${TAG} does not match __version__ ${version}"
            exit 1
          fi

      - name: Build the package
        run: uv build --no-sources

      - name: List the distributions
        run: ls -l dist/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/satsumaestro/
    permissions:
      id-token: write # Trusted Publishing の OIDC トークンと attestation の署名に使う
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: Create the GitHub Release
    needs: publish-pypi
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # Release を作り配布物を添える
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Write the release notes from the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v head="## [${version}]" '
            index($0, head) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | sed -e '1{/^$/d;}' > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for ${version}"
            exit 1
          fi
          printf '%s\n' 'Install: `uv tool install satsumaestro` (or `pipx install satsumaestro`, or `brew install katoi-t/tap/satsumaestro`). See the [README](https://github.com/KATOI-T/SATSUMAESTRO#readme) for setup.' >> notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          case "${TAG}" in
            *a[0-9]* | *b[0-9]* | *rc[0-9]*) flags+=(--prerelease) ;;
          esac
          gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --verify-tag \
            --title "SATSUMAESTRO ${TAG#v}" --notes-file notes.md "${flags[@]}" dist/*

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/satsumaestro/
    permissions:
      id-token: write # Trusted Publishing の OIDC トークンと attestation の署名に使う
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
